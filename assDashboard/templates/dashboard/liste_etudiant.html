<!DOCTYPE html>
<html>
<head>
    <title>Liste des étudiants</title>
    <style>
        table {
            border-collapse: collapse;
            width: 80%;
            margin: auto;
        }
        th, td {
            border: 1px solid #ccc;
            padding: 8px;
            text-align: center;
        }
        th {
            background-color: #f4f4f4;
        }
    </style>
</head>
<body>

<h2 style="text-align:center;">Liste des étudiants</h2>

<table>
    <tr>
        <th>Nom</th>
        <th>Prénoms</th>
        <th>Mention</th>
        <th>Niveau</th>
        <th>Genre</th>
        <th>Identifiant</th>
    </tr>

    {% for etu in etudiants %}
    <tr>
        <td>{{ etu.nom }}</td>
        <td>{{ etu.prenoms }}</td>
        <td>{{ etu.mention }}</td>
        <td>{{ etu.niveau }}</td>
        <td>{{ etu.genre }}</td>
        <td>
            {{ etu.user.username }}<br>
            {% if etu.photo %}
                <img src="{{ etu.photo.url }}" alt="Photo de {{ etu.nom }}" width="50">
            {% endif %}
            <br>
            <a href="{% url 'profil_eleves' etu.id %}">Voir profil</a>
        </td>
    </tr>

    {% empty %}
    <tr>
        <td colspan="6">Aucun étudiant trouvé.</td>
    </tr>
    {% endfor %}
</table>

</body>
</html>
